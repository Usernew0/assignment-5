<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Assignment 5</title>
  </head>
  <body>
    <div class="dashboard">
      <aside id="sidebar" class="sidebar">
        <div class="container">
          <div class="logo">
            <div class="project-logo">
              <img src="./images/icons/coins-solid-full.png" alt="project logo coins" />
            </div>
            <div class="project-name">
              <h1>مدبّر</h1>
              <p>إدارة أموالك بذكاء</p>
            </div>
          </div>
          <div id="nav" class="nav">
            <ul>
              <li>
                <span class="span selected">
                  <img src="./images/icons/house-solid-full.png" alt="home icon" />
                  <span class="colored span-name">الصفحة الرئيسية</span>
                </span>
              </li>
              <li>
                <span class="span">
                  <img src="./images/icons/arrow-right-arrow-left-solid-full.png" alt="transactions icon" />
                  <span class="span-name">المعاملات</span>
                </span>
              </li>
              <li>
                <span class="span">
                  <img src="./images/icons/chart-pie-solid-full.png" alt="chart pie icon" />
                  <span class="span-name">الميزانيات</span>
                </span>
              </li>
              <li>
                <span class="span">
                  <img src="./images/icons/piggy-bank-solid.png" alt="piggy bank icon" />
                  <span class="span-name">المدخرات</span>
                </span>
              </li>
              <li>
                <span class="span">
                  <img src="./images/icons/file-invoice-dollar-solid-full.png" alt="invoice icon" />
                  <span class="span-name">الفواتير الشهرية</span>
                </span>
              </li>
            </ul>
          </div>
          <div class="sidebar-quick-actions">
            <h3>إجراءات سريعة</h3>
            <div class="actions">
              <button>
                <div class="action-icon send-money">
                  <img src="./images/icons/paper-plane-solid-full.png" alt="paper icon" />
                </div>
                <span>إرسال أموال</span>
              </button>
              <button>
                <div class="action-icon plus">
                  <img src="./images/icons/plus-solid-full.png" alt="plusicon" />
                </div>
                <span>إضافة أموال</span>
              </button>
              <button>
                <div class="action-icon receipt">
                  <img src="./images/icons/receipt-solid-full.png" alt="receipt icon" />
                </div>
                <span>دفع فاتورة</span>
              </button>
              <button>
                <div class="action-icon chart-line">
                  <img src="./images/icons/chart-line-solid-full.png" alt="chart line icon" />
                </div>
                <span>استثمار</span>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <div id="main" class="main">
        <div class="header">
          <div class="right-content">
            <div class="logo">
              <img src="./images/icons/coins-solid-full.png" alt="logo icon" />
            </div>
            <div class="title">
              <h1>مدبّر</h1>
              <p>إدارة أموالك بذكاء</p>
            </div>
            <div class="active">
              <div class="dot"></div>
              <span>متصل</span>
            </div>
          </div>
          <div class="left-content">
            <div class="icons">
              <div class="imgbg">
                <img src="./images/icons/magnifying-glass-solid-full.png" alt="search icon" />
              </div>
              <div class="imgbg">
                <img src="./images/icons/bell-regular-full.png" alt="notification icon" />
                <span>2</span>
              </div>
            </div>
            <div class="prof-info">
              <div class="info">
                <p class="name">سيف أسامة</p>
                <p class="status">حساب مميز</p>
              </div>
              <img src="./images/avatar-1.jpg" alt="profile image" />
            </div>
          </div>
        </div>
        <div class="summary-cards"></div>
        <div class="dashboard-widgets"></div>
      </div>
    </div>
  </body>
</html>
